[project]
name = "awsiotclient"
version = "0.2.2"
description = "The AWS IoT Device Client provides device-side functionality for AWS IoT services such as jobs, device shadow, and simple pubsub."
authors = [{ name = "WHILL Inc." }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
# 3.8 is kept for ROS Noetic.
requires-python = ">=3.8,<4.0"
dependencies = ["awsiotsdk>=1.5.11,<2.0.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/whill-labs/aws-iot-device-client-python"

[dependency-groups]
lint = [
    "black>=23.3.0,<24.0.0",
    "flake8>=6.0.0,<7.0.0; python_full_version >= '3.8.1'",
    "flake8-pyproject>=1.2.3,<2.0.0",
    "isort>=5.12.0,<6.0.0",
    "mypy>=1.3.0,<2.0.0",
]
e2e = ["boto3>=1.26.155,<2.0.0"]
dev = [
    { include-group = "lint" },
    { include-group = "e2e" },
]

[tool.isort]
profile = "black"

[tool.flake8]
ignore = "E501"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awsiotclient"]

[tool.hatch.build.targets.sdist]
only-include = ["src/awsiotclient", "README.md", "LICENSE"]
