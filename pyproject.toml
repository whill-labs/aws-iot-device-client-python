[project]
name = "awsiotclient"
version = "0.2.2"
description = "The AWS IoT Device Client provides device-side functionality for AWS IoT services such as jobs, device shadow, and simple pubsub."
authors = [{ name = "WHILL Inc." }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
# 3.8 is kept for ROS Noetic.
requires-python = ">=3.8,<4.0"
dependencies = ["awsiotsdk>=1.5.11,<2.0.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/whill-labs/aws-iot-device-client-python"

[dependency-groups]
test = [
    "pytest>=8.0.0,<9.0.0",
    "hypothesis>=6.0.0,<7.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
]
lint = [
    "black>=23.3.0,<24.0.0",
    "flake8>=6.0.0,<7.0.0; python_full_version >= '3.8.1'",
    "flake8-pyproject>=1.2.3,<2.0.0",
    "isort>=5.12.0,<6.0.0",
    "mypy>=1.3.0,<2.0.0",
]
e2e = ["boto3>=1.26.155,<2.0.0"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "e2e" },
]

[tool.pytest.ini_options]
testpaths = ["test"]
# Disable ROS 2 pytest plugins that get loaded when a ROS environment is sourced
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_xmllint -p no:ament_pep257 -p no:ament_mypy -p no:ament_lint -p no:ament_flake8"

[tool.coverage.run]
source = ["awsiotclient"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
[[tool.mypy.overrides]]
module = ["awscrt", "awscrt.*", "awsiot", "awsiot.*"]
ignore_missing_imports = true

[tool.isort]
profile = "black"

[tool.flake8]
ignore = "E501"
# Conflicts with black
extend-ignore = "W503"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awsiotclient"]

[tool.hatch.build.targets.sdist]
only-include = ["src/awsiotclient", "README.md", "LICENSE"]
