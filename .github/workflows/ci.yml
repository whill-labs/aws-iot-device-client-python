name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# E2E tests (test/e2e) need a real AWS IoT account and are run locally only.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # GitHub official
      - uses: astral-sh/setup-uv@v10.2.0 # uv's publisher (Astral)
      - run: uv sync --python 3.12 --no-default-groups --group lint
      - run: uv run --no-sync black --check src test
      - run: uv run --no-sync isort --check-only --diff src test
      - run: uv run --no-sync flake8 src test
      - run: uv run --no-sync mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6 # GitHub official
      - uses: astral-sh/setup-uv@v10.2.0 # uv's publisher (Astral)
      - run: uv sync --python ${{ matrix.python-version }} --no-default-groups --group test
      - name: Unit tests
        run: uv run --no-sync pytest test/unit --cov --cov-report=term-missing

  # The lowest versions allowed by pyproject.toml, on the platform ROS Noetic
  # runs on (Ubuntu 20.04 and its system Python 3.8).
  min-deps:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Install system Python
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-distutils
      - uses: actions/checkout@v6 # GitHub official
      - uses: astral-sh/setup-uv@v10.2.0 # uv's publisher (Astral)
        with:
          cache-suffix: lowest-direct
      - run: uv sync --python /usr/bin/python3 --resolution lowest-direct --no-default-groups --group test
      - name: Unit tests
        run: uv run --no-sync pytest test/unit -p no:cacheprovider

  # Test the built wheel rather than the source tree.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # GitHub official
      - uses: astral-sh/setup-uv@v10.2.0 # uv's publisher (Astral)
      - run: uv build
      - name: Install the wheel
        run: |
          uv venv --python 3.12 /tmp/venv
          uv pip install --python /tmp/venv dist/*.whl --group test
          /tmp/venv/bin/python -c "import awsiotclient, sys; print(awsiotclient.__file__); sys.exit('site-packages' not in awsiotclient.__file__)"
      - name: Unit tests
        run: /tmp/venv/bin/python -m pytest test/unit -p no:cacheprovider
